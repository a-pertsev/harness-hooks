[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-hooks"
version = "0.2.0"
description = "Install and remove Claude Code and Codex hooks and settings from config files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexei Pertsev"}]
requires-python = ">=3.9"
dependencies = ["tomlkit>=0.13"]
keywords = ["claude-code", "codex", "hooks", "settings"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/a-pertsev/harness-hooks"

[project.scripts]
harness-hooks = "harness_hooks:main"

[tool.hatch.build.targets.wheel]
only-include = ["harness_hooks.py"]
